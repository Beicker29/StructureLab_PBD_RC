workshop_id: workshop_01
title: "Caracterizacion mecanica monotonica de materiales"

units:
  length: mm
  force: kN
  moment: kN-m
  stress: MPa
  strain: mm/mm

source_reference:
  pdf: "references/pdfs/ACTIVIDAD 1 CARACTERIZACIA_N MECA_NICA DE MATERIALES.pdf"
  pdf_search_pattern: "references/pdfs/ACTIVIDAD 1*.pdf"
  instructor: "William Valencia Mina"
  course_topic: "Introduccion al diseno sismico basado en desempeno"

section:
  type: square_reinforced_concrete_column
  width: 750.0
  height: 750.0
  clear_cover_to_tie: 40.0
  confined_core_boundary: tie_centerline
  longitudinal_bars_per_side: 5
  transverse_legs_x: 2
  transverse_legs_y: 2
  confined_core:
    boundary: tie_centerline
    width: auto
    height: auto
    clear_tie_spacing: auto
    clear_spacing_wi:
      unit: mm
      values: [131, 286, 131, 131, 286, 131, 131, 286, 131, 131, 286, 131]

concrete:
  f_co: 28.0
  Ec_expression: "4700 * sqrt(f_co)"
  ft_expression: "0.62 * sqrt(f_co)"
  Et_expression: "Ec"
  epsilon_t_expression: "ft / Et"
  epsilon_co: 0.002
  epsilon_sp: 0.005  # Tomado del documento ASCE 41-23 para representar la deformacion de descascaramiento.
  models:
    - mander_classic_unconfined_concrete
    - mander_classic_confined_concrete
    - mander_adjusted_confined_concrete
    - attard_setunge_unconfined_concrete
    - attard_setunge_confined_concrete

longitudinal_reinforcement:
  count: 16
  bar_mark: "#7"
  diameter: 22.2
  steel:
    source: "Tabla de aceros colombianos; valores deterministicos de la columna mu."
    fy: 470.30
    epsilon_y: 0.0024
    Es: 200000.0
    f_sh: 472.16
    epsilon_sh: 0.0138
    f_su: 659.74
    epsilon_su: 0.1141
    P: 3.087
    Et:
      value: auto
      expression: "(f_sh - f_y) / (epsilon_sh - epsilon_y)"
    compression_buckling:
      enabled: true
      degradation_alpha: 3.0
      epsilon_su_compression: 0.08
      epsilon_buckling: null

transverse_reinforcement:
  type: rectangular_ties
  bar_mark: "#4"
  diameter: 12.7
  spacing: 100.0
  fyh: 470.0
  epsilon_su: 0.10
  role:
    - confinement
    - longitudinal_bar_buckling_stabilization

welded_wire_mesh:
  include_for_comparison: true
  default_diameter: 5
  selectable_diameters: [4, 5, 6]
  mechanical_properties:
    4:
      fy: 612.0
      fu: 689.0
      epsilon_u: 0.0124
    5:
      fy: 610.0
      fu: 681.0
      epsilon_u: 0.0113
    6:
      fy: 641.0
      fu: 691.0
      epsilon_u: 0.0095
  model: carrillo_2019_welded_wire_mesh

model_inputs:
  mander_classic_unconfined_concrete:
    f_co: concrete.f_co
    Ec: concrete.Ec_expression
    ft: concrete.ft_expression
    Et: concrete.Et_expression
    epsilon_t: concrete.epsilon_t_expression
    epsilon_co: concrete.epsilon_co
    epsilon_2co_expression: 2 * concrete.epsilon_co
    epsilon_sp: concrete.epsilon_sp
  confinement:
    core_width: section.confined_core.width
    core_height: section.confined_core.height
    tie_spacing: transverse_reinforcement.spacing
    tie_diameter: transverse_reinforcement.diameter
    transverse_legs_x: section.transverse_legs_x
    transverse_legs_y: section.transverse_legs_y
    Ash_x: auto
    Ash_y: auto
    fyh: transverse_reinforcement.fyh
    rho_cc: auto
    clear_spacing_wi: section.confined_core.clear_spacing_wi.values
    clear_tie_spacing: section.confined_core.clear_tie_spacing
  mander_classic_confined_concrete:
    f_co: concrete.f_co
    Ec: concrete.Ec_expression
    epsilon_co: concrete.epsilon_co
    epsilon_su_transverse: transverse_reinforcement.epsilon_su
    confinement: model_inputs.confinement
  mander_adjusted_confined_concrete:
    f_co: concrete.f_co
    Ec: concrete.Ec_expression
    epsilon_co: concrete.epsilon_co
    epsilon_su_transverse: transverse_reinforcement.epsilon_su
    confinement: model_inputs.confinement
    epsilon_tst_expression: "min(0.6 * epsilon_su_transverse, 0.06)"
  attard_setunge_unconfined_concrete:
    f_co: concrete.f_co
    Ec: concrete.Ec_expression
    epsilon_co: concrete.epsilon_co
    epsilon_u: concrete.epsilon_sp
    alpha_expression: "limit(1.17 - 0.002125*(f_co - 20), 1.00, 1.17)"
    fpl_expression: "0.45 * f_co"
  attard_setunge_confined_concrete:
    f_co: concrete.f_co
    Ec: concrete.Ec_expression
    epsilon_co: concrete.epsilon_co
    fl: model_inputs.confinement.fl_eff
    fcc_expression: "f_co * (1 + 10 * (fl / f_co) ** 0.6)"
    epsilon_cc_expression: "epsilon_co * (1 + (69.4 - 13.2*ln(f_co)) * fl / f_co)"
    fpl_expression: "0.45 * f_co"
  steel_tension_mander:
    fy: longitudinal_reinforcement.steel.fy
    Es: longitudinal_reinforcement.steel.Es
    epsilon_y: longitudinal_reinforcement.steel.epsilon_y
    f_sh: longitudinal_reinforcement.steel.f_sh
    epsilon_sh: longitudinal_reinforcement.steel.epsilon_sh
    f_su: longitudinal_reinforcement.steel.f_su
    epsilon_su: longitudinal_reinforcement.steel.epsilon_su
    P: longitudinal_reinforcement.steel.P
    Et: longitudinal_reinforcement.steel.Et
  steel_compression_no_buckling:
    fy: longitudinal_reinforcement.steel.fy
    Es: longitudinal_reinforcement.steel.Es
    epsilon_y: longitudinal_reinforcement.steel.epsilon_y
    f_su: longitudinal_reinforcement.steel.f_su
    epsilon_su_compression: longitudinal_reinforcement.steel.compression_buckling.epsilon_su_compression
    epsilon_sh: longitudinal_reinforcement.steel.epsilon_sh
    P: longitudinal_reinforcement.steel.P
    Et: longitudinal_reinforcement.steel.Et
  steel_compression_with_buckling:
    fy: longitudinal_reinforcement.steel.fy
    Es: longitudinal_reinforcement.steel.Es
    epsilon_y: longitudinal_reinforcement.steel.epsilon_y
    transverse_spacing: transverse_reinforcement.spacing
    longitudinal_bar_diameter: longitudinal_reinforcement.diameter
    degradation_alpha: longitudinal_reinforcement.steel.compression_buckling.degradation_alpha
    epsilon_su_compression: longitudinal_reinforcement.steel.compression_buckling.epsilon_su_compression
  welded_wire_mesh:
    diameter: welded_wire_mesh.default_diameter
    fy_fu_epsilon_u_by_diameter: welded_wire_mesh.mechanical_properties
    Es: longitudinal_reinforcement.steel.Es

curve_generation:
  num_points: 401
  concrete_max_strain: auto
  steel_max_strain: auto
  mesh_max_strain: auto
  sign_convention:
    compression: positive
    tension: negative
