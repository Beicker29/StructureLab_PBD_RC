  phi_peak:
    value: 0.051707
    unit: '[1/m]'
  phi_u:
    value: 0.051707
    unit: '[1/m]'
    criterion: final_valid_point
  Mu:
    value: 346.056
    unit: '[kN-m]'
    equation: Mu = M(phi_u)
  M_60My:
    value: 174.9621477575515
    unit: '[kN-m]'
