  limitations:
    - La implementacion RDM 2019 corresponde a una envolvente constitutiva uniaxial monotonica. No incluye
      reglas historicas ciclicas.
    - El calculo interno RDM usa magnitudes positivas de compresion. El CSV y la figura exportan traccion
      con signo positivo y compresion con signo negativo; no constituyen una historia ciclica.
    - El calculo de n implementado corresponde inicialmente a secciones rectangulares con refuerzo transversal.
      Secciones circulares, losas y otras configuraciones de restriccion requieren estrategias distintas.
