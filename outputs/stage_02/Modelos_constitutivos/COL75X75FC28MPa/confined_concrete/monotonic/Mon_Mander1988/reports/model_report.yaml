  limitations:
    - La implementacion corresponde a la envolvente uniaxial monotonica con compresion positiva y un segmento
      elastico de traccion negativa. No contiene reglas de descarga, recarga ni degradacion ciclica.
    - Para secciones rectangulares se usa la presion efectiva escalar f_l=0.5*k_e*rho_s*fyh, con rho_s=rho_x+rho_y.
      f_lx y f_ly se conservan como diagnosticos y William-Warnke no se implementa.
