  limitations:
    - El modelo Ramberg-Osgood modificado implementado para malla electrosoldada representa la respuesta
      monotonica en traccion. La respuesta monotonica en compresion no cuenta con una calibracion especifica
      para malla NTC 5806; por defecto se considera no soportada. La opcion simetrica, si se activa, constituye
      una hipotesis prepandeo y no una validacion experimental.
    - La fluencia efectiva FEMA no es un input ni un parametro de la ecuacion Ramberg-Osgood. Se calcula
