stage_id: stage_03
title: Caracterizacion de la seccion por diagrama momento-curvatura
model:
  key: asce_fema_moment_curvature_bilinearization
  description: Idealizacion bilineal ASCE/FEMA adaptada al diagrama momento-curvatura.
curve:
  id: positive_bending
  name: VIGA T-P6
  sign: positive
  sheet: VIGA T- P6
units:
  curvature: '[1/m]'
  moment: '[kN-m]'
  stiffness: '[kN-m/(1/m)]'
  area: '[kN]'
datos_de_entrada:
  source_workbook: references\stage_03\excel\M-curvatura.xlsx
  sheet: VIGA T- P6
  curvature_column: A
  moment_column: B
  first_data_row: 4
  stiffness_fraction: 0.6
  tolerance: 0.01
  ultimate:
    mode: first_post_peak_strength_drop
    post_peak_strength_ratio: 0.8
datos_de_salida:
  M_peak:
    value: 409.208
    unit: '[kN-m]'
  phi_peak:
    value: 0.060816
    unit: '[1/m]'
  phi_u:
    value: 0.060816
    unit: '[1/m]'
    criterion: final_valid_point
  Mu:
    value: 409.208
    unit: '[kN-m]'
    equation: Mu = M(phi_u)
  M_60My:
    value: 200.07889133026606
    unit: '[kN-m]'
    equation: M_60My = 0.60 * My
  phi_60My:
    value: 0.001863444463334676
    unit: '[1/m]'
    equation: phi_60My = phi(M_60My)
  Ke:
    value: 107370.46113637341
    unit: '[kN-m/(1/m)]'
    equation: Ke = M_60My / phi_60My
  My:
    value: 333.4648188837768
    unit: '[kN-m]'
    criterion: energia_equivalente
  phi_y:
    value: 0.0031057407722244602
    unit: '[1/m]'
    equation: phi_y = My / Ke
  Kp:
    value: 1312.473416854253
    unit: '[kN-m/(1/m)]'
    equation: Kp = (Mu - My) / (phi_u - phi_y)
  alpha:
    value: 0.012223784856314007
    unit: '[-]'
    equation: alpha = Kp / Ke
  A_real:
    value: 21.946941113999994
    unit: '[kN]'
    equation: A_real = integral M(phi) dphi
  A_bilinear:
    value: 21.947748091657672
    unit: '[kN]'
    equation: A_bilinear = 0.5*My*phi_y + 0.5*(My + Mu)*(phi_u - phi_y)
  relative_error:
    value: 3.676948206524595e-05
    unit: '[-]'
  absolute_relative_error:
    value: 3.676948206524595e-05
    unit: '[-]'
  ductility_phi:
    value: 19.581801721474992
    unit: '[-]'
    equation: mu_phi = phi_u / phi_y
  constitutive_function:
    branches:
      - range: 0 <= phi <= phi_y
        equation: M(phi) = 107370.46 * phi
      - range: phi_y < phi <= phi_u
        equation: M(phi) = 333.46482 + (1312.4734) * (phi - 0.0031057408)
  status: converged
