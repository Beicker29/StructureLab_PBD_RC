datos_de_salida:
  M_peak:
    value: 680.381
    unit: '[kN-m]'
  phi_peak:
    value: 0.103894
    unit: '[1/m]'
  phi_u:
    value: 0.114283
    unit: '[1/m]'
    criterion: final_valid_point
  Mu:
    value: 679.115
    unit: '[kN-m]'
    equation: Mu = M(phi_u)
  M_60My:
    value: 375.56786213842764
    unit: '[kN-m]'
    equation: M_60My = 0.60 * My
  phi_60My:
    value: 0.0042633852042597105
    unit: '[1/m]'
    equation: phi_60My = phi(M_60My)
  Ke:
    value: 88091.46819836582
    unit: '[kN-m/(1/m)]'
    equation: Ke = M_60My / phi_60My
  My:
    value: 625.9464368973794
    unit: '[kN-m]'
    criterion: energia_equivalente
  phi_y:
    value: 0.007105642007099517
    unit: '[1/m]'
    equation: phi_y = My / Ke
  Kp:
    value: 496.0801805372227
    unit: '[kN-m/(1/m)]'
    equation: Kp = (Mu - My) / (phi_u - phi_y)
  alpha:
    value: 0.005631421415523932
    unit: '[-]'
    equation: alpha = Kp / Ke
  A_real:
    value: 72.15987867300001
    unit: '[kN]'
    equation: A_real = integral M(phi) dphi
  A_bilinear:
    value: 72.16039406064591
    unit: '[kN]'
    equation: A_bilinear = 0.5*My*phi_y + 0.5*(My + Mu)*(phi_u - phi_y)
  relative_error:
    value: 7.142302001923882e-06
    unit: '[-]'
  absolute_relative_error:
    value: 7.142302001923882e-06
    unit: '[-]'
  ductility_phi:
    value: 16.083416514062417
    unit: '[-]'
    equation: mu_phi = phi_u / phi_y
  constitutive_function:
    branches:
      - range: 0 <= phi <= phi_y
        equation: M(phi) = 88091.468 * phi
      - range: phi_y < phi <= phi_u
        equation: M(phi) = 625.94644 + (496.08018) * (phi - 0.007105642)
  status: converged
