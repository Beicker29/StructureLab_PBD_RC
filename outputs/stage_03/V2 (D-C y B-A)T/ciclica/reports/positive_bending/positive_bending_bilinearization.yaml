    unit: '[kN]'
    equation: A_real = integral M(phi) dphi
  A_bilinear:
    value: 60.49745646258807
    unit: '[kN]'
    equation: A_bilinear = 0.5*My*phi_y + 0.5*(My + Mu)*(phi_u - phi_y)
