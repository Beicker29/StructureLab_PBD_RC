    value: 479.4250238247649
    unit: '[kN-m]'
    criterion: energia_equivalente
  phi_y:
    value: 0.007193610907440721
    unit: '[1/m]'
    equation: phi_y = My / Ke
  Kp:
    value: 428.92182469669683
    unit: '[kN-m/(1/m)]'
