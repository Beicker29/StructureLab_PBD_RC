    unit: '[kN-m]'
  phi_peak:
    value: 0.103894
    unit: '[1/m]'
  phi_u:
    value: 0.114283
    unit: '[1/m]'
    criterion: final_valid_point
  Mu:
    value: 525.358
    unit: '[kN-m]'
