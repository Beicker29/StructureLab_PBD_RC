    unit: '[-]'
    equation: mu_phi = phi_u / phi_y
  constitutive_function:
    branches:
      - range: 0 <= phi <= phi_y
        equation: M(phi) = 66645.949 * phi
      - range: phi_y < phi <= phi_u
        equation: M(phi) = 479.42502 + (428.92182) * (phi - 0.0071936109)
  status: converged
