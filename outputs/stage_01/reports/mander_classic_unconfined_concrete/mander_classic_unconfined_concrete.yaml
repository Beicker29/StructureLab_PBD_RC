    description: Funcion constitutiva usada para graficar el concreto no confinado de Mander.
    variable: epsilon_c
    stress: fc
    branches:
      - range: -0.000131915 <= epsilon_c < 0
        equation: fc = 24870.1 * epsilon_c
        units:
          epsilon_c: '[mm/mm]'
          fc: '[MPa]'
